name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package DMG
        run: MACEQ_IDENTITY=- ./scripts/dmg.sh 0.0.0
